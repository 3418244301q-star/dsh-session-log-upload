# Cross-channel session-log upload.
# Defaults mirror SPEC-跨渠道会话日志上传.md §4.2. `enabled: false` means the
# plugin loads but never sends anything until the user turns it on.
- insert:
    - id: dsh-session-sync
      name: dsh-session-sync
      config:
        enabled: false
        mode: deferred
        apiKeyRef: DEEPSEEK_API_KEY
        model: deepseek-flash
        maxBytes: 8388608
        idleDelayMs: 600000
        includeSeeded: false
        budget:
          maxRequestsPerHour: 60
        retry:
          maxAttempts: 3
          baseDelayMs: 2000
